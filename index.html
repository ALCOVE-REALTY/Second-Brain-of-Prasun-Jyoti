<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Second Brain">
<meta name="theme-color" content="#0f2a52">
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/alcoverealty.in/s/AKfycbxk2oEW-0AqfZxXvhDhObdTCGxGvQsCWtoff1BtvXEfo5Hc3ciXAIpz1w-yio14M0UgIw/exec">
<title>Alcove Second Brain</title>
<style>
:root{--bg:#f5f3ee;--ink:#1d2433;--muted:#6a7385;--brand:#7a1f2b;--navy:#0f2a52;--card:#fff;--line:#e4e0d6}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--ink:#eceef3;--muted:#9aa3b5;--brand:#c94a5b;--card:#1c1f27;--line:#2a2e39}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,system-ui,"Segoe UI",sans-serif}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center}
.top{background:var(--navy);color:#fff;padding:22px 18px}
.top h1{margin:0;font-size:21px}
.top p{margin:4px 0 0;font-size:13px;opacity:.85}
.body{padding:22px 20px 20px}
a.btn{display:block;padding:16px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;font-size:18px}
p.s{color:var(--muted);font-size:14px;margin:14px 0 0}
</style>
</head>
<body>
<div class="card">
  <div class="top"><h1>Alcove Second Brain</h1><p>Opening dashboard&hellip;</p></div>
  <div class="body">
    <a class="btn" href="https://script.google.com/a/macros/alcoverealty.in/s/AKfycbxk2oEW-0AqfZxXvhDhObdTCGxGvQsCWtoff1BtvXEfo5Hc3ciXAIpz1w-yio14M0UgIw/exec">Open Dashboard</a>
    <p class="s">Not opening? Tap the button. Sign in with your own @alcoverealty.in Google account, in Safari or Chrome.</p>
  </div>
</div>
<script>
window.location.replace("https://script.google.com/a/macros/alcoverealty.in/s/AKfycbxk2oEW-0AqfZxXvhDhObdTCGxGvQsCWtoff1BtvXEfo5Hc3ciXAIpz1w-yio14M0UgIw/exec");
</script>
</body>
</html>
