<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcove Second Brain (Live)</title>
<style>
:root{--bg:#f5f3ee;--ink:#1d2433;--muted:#6a7385;--brand:#7a1f2b;--bar:#ffffff;--line:#e4e0d6}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--ink:#eceef3;--muted:#9aa3b5;--brand:#e58a97;--bar:#1c1f27;--line:#2a2e39}}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif}
.bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar b{color:var(--brand)}
.bar span{color:var(--muted);font-size:12.5px}
a.btn{padding:6px 12px;border-radius:8px;background:var(--brand);color:#fff;text-decoration:none;font-weight:600;font-size:13px}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
@media(max-width:640px){.bar{padding:6px 10px;gap:6px}.bar span{display:none}.bar b{font-size:14px}a.btn{padding:6px 10px;font-size:12px}}
</style>
</head>
<body>
<div class="bar">
  <div><b>Alcove Second Brain</b> <span>&middot; live, updates every 5 minutes</span></div>
  <div><span>Blank page? Sign in as dc@alcoverealty.in, or use the button &rarr;</span>
  <a class="btn" target="_blank" rel="noopener" href="https://script.google.com/macros/s/AKfycbxk2oEW-0AqfZxXvhDhObdTCGxGvQsCWtoff1BtvXEfo5Hc3ciXAIpz1w-yio14M0UgIw/exec">Open in new tab</a></div>
</div>
<iframe title="Alcove Second Brain live dashboard" src="https://script.google.com/macros/s/AKfycbxk2oEW-0AqfZxXvhDhObdTCGxGvQsCWtoff1BtvXEfo5Hc3ciXAIpz1w-yio14M0UgIw/exec"></iframe>
</body>
</html>
